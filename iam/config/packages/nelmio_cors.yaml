nelmio_cors:
    defaults:
        allow_origin: ['http://localhost:3000', 'http://localhost:3002']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: []
        max_age: 3600
    paths:
        '^/':
            allow_origin: [ 'http://localhost:3000', 'http://localhost:3002' ]
            allow_methods: [ 'GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE' ]
            allow_headers: [ 'Content-Type', 'Authorization' ]
            max_age: 3600

